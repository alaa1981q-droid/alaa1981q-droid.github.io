<script>
(async function(){
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var AR='٠١٢٣٤٥٦٧٨٩';
var num=function(v){v=String(v==null?'':v).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/[,٬،\s]/g,'').replace('٫','.');v=parseFloat(v);return isFinite(v)?v:0};
var fmt=function(n){return Math.round(n||0).toLocaleString('en-US')};
var money=function(n){return fmt(n)+' د.ع'};
var isoOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var todayISO=function(){return isoOf(new Date())};
var addMonths=function(iso,k){var p=iso.split('-').map(Number);var dim=new Date(p[0],p[1]-1+k+1,0).getDate();return isoOf(new Date(p[0],p[1]-1+k,Math.min(p[2],dim)))};
var MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
var addDays=function(iso,k){var p=iso.split('-').map(Number);return isoOf(new Date(p[0],p[1]-1,p[2]+k))};
var weekStart=function(iso){var p=iso.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]);return addDays(iso,-((d.getDay()+1)%7))};
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var dayName=function(iso){var p=iso.split('-').map(Number);return DAYS[new Date(p[0],p[1]-1,p[2]).getDay()]};
var timeNow=function(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
var fdate=function(iso){if(!iso)return '';var p=iso.split('-');return Number(p[2])+' / '+Number(p[1])+' / '+p[0]};

var S={stock:[],docs:null,docsFor:'',cashTab:'exp',cmonth:todayISO().slice(0,7),expenses:[],income:[],staff:[],salaries:[],hist:[],customers:[],sales:[],payments:[],shop:{},ready:{c:false,s:false,p:false,h:false},admin:false,canWrite:true,view:'home',cid:null,q:'',mode:'month',day:todayISO(),wk:'',month:todayISO().slice(0,7),year:new Date().getFullYear(),timeout:false,err:''};
var cmap={},smap={};
var PCSS="@page{size:A4;margin:10mm}.pa{font-family:'Tajawal',Tahoma,sans-serif;color:#111;direction:rtl;font-size:13px;line-height:1.45}.pa *{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pa .rc{border:2px solid var(--k);border-radius:10px;padding:7mm 8mm;height:128mm;overflow:hidden}.pa .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;border-bottom:2px solid var(--k);padding-bottom:3mm}.pa .shop{font-size:20px;font-weight:700}.pa .cp{background:var(--k);color:#fff;padding:1.8mm 4mm;border-radius:6px;font-weight:700;font-size:14px;white-space:nowrap}.pa .tt{text-align:center;font-size:18px;font-weight:700;margin:3mm 0 2.5mm}.pa table{width:100%;border-collapse:collapse;margin:1mm 0}.pa td,.pa th{border:1px solid #9a9a9a;padding:1.5mm 2.4mm;text-align:right;vertical-align:top}.pa th{background:#eef2ee;font-weight:700}.pa tr{break-inside:avoid}.pa .big td,.pa .big th{font-size:15.5px;font-weight:700}.pa .sig{display:flex;justify-content:space-between;margin-top:8mm;font-size:13px}.pa .sig span{border-top:1px solid #333;padding-top:1.5mm;width:38%;text-align:center}.pa .cut{text-align:center;color:#666;font-size:12px;height:10mm;line-height:10mm;border-top:1.5px dashed #777;margin-top:3mm}.pa .ft{text-align:center;font-size:12px;color:#444;margin-top:2.5mm}.pa h1{font-size:20px;margin:0}.pa h2{font-size:15px;margin:5mm 0 1.5mm;border-right:4px solid #1f7a4d;padding-right:2mm}.pa .meta{color:#444;font-size:12.5px}.pa .tot td{font-weight:700;background:#f6f6f6}.pa ol.cl{margin:1mm 0;padding-right:6mm;font-size:12.5px}.pa ol.cl li{margin:.8mm 0}.pa .sm3 td,.pa .sm3 th{padding:1mm 1.5mm;font-size:11.5px}.pa .sig3 span{width:30%}.pa .sig small{color:#555}.pa .none{color:#666;font-size:12.5px;padding:1mm 0}";
var app=$('#app'),modal=$('#modal');

var db=null,user=null;
try{db=await window.claude.use('db')}catch(e){db=null}
try{user=await window.claude.use('user')}catch(e){user=null}
if(!db){app.innerHTML='<div class="empty"><h3>تعذّر فتح قاعدة البيانات</h3><p>سجّل الدخول إلى حسابك ثم أعد فتح الصفحة.</p></div>';return}
var DL=null;try{DL=await window.claude.use('downloads')}catch(e){DL=null}
try{S.admin=!!(user&&await user.canEdit())}catch(e){S.admin=false}
try{var cw=user?await user.can('data.write'):null;S.canWrite=(cw!==false)}catch(e){}

/* ---------- data ---------- */
function mapDocs(snap){return snap.docs.map(function(d){return Object.assign({},d.data()||{},{id:d.id})})}
function sub(path,key,after){
  return db.collection(path).onSnapshot(function(snap){
    S[key]=mapDocs(snap);S.ready[key==='customers'?'c':key==='sales'?'s':'p']=true;reindex();after()
  },function(e){S.err=(e&&e.code)||'error';S.ready[key==='customers'?'c':key==='sales'?'s':'p']=true;render()});
}
function reindex(){
  cmap={};S.customers.forEach(function(c){cmap[c.id]=c});
  smap={};S.sales.forEach(function(s){s.price=+s.price||0;s.cost=+s.cost||0;s.down=+s.down||0;s.months=Math.max(1,+s.months||1);smap[s.id]=s});
  S.payments.forEach(function(p){p.amount=+p.amount||0});
}
function upsert(key,id,data){var o=Object.assign({},data,{id:id}),arr=S[key],i=arr.findIndex(function(x){return x.id===id});if(i>-1)arr[i]=o;else arr.push(o);reindex();}
function dropLocal(key,id){S[key]=S[key].filter(function(x){return x.id!==id});reindex()}
var AN=function(t){return String(t==null?'':t).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ئ/g,'ي').replace(/ؤ/g,'و').replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/\s+/g,' ').trim()};
function phN(t){var d=String(t||'').replace(/[^0-9]/g,'');if(d.indexOf('00964')===0)d=d.slice(5);else if(d.indexOf('964')===0)d=d.slice(3);return d.replace(/^0+/,'')}
function custMatch(c,q){if(!q)return true;q=AN(q);if(!q)return true;var hay=AN([c.name,c.phone,c.address].join(' '));S.sales.forEach(function(x){if(x.customerId===c.id)hay+=' '+AN([x.item,x.gName,x.gPhone].join(' '))});var flat=hay.replace(/ /g,'');var ph=phN(c.phone);
  return q.split(' ').every(function(w){if(hay.indexOf(w)>-1||flat.indexOf(w)>-1)return true;var wd=phN(w);return wd.length>=3&&/^[0-9]+$/.test(w)&&ph.indexOf(wd)>-1})||flat.indexOf(q.replace(/ /g,''))>-1}
function custCard(c){
  var st=custStats(c.id);
  var tag=st.count===0?'<span class="tag done">بلا مبيعات</span>':st.remaining<=0.5?'<span class="tag done">مسدَّد</span>':st.shortfall>0.5?'<span class="tag late">متأخر</span>':'<span class="tag ok">منتظم</span>';
  var h='<div class="ccard"><div class="row">'+avatar(c)+'<div class="grow"><h3>'+esc(c.name)+'</h3><div>📞 '+esc(c.phone||'لا يوجد رقم')+'</div>'+(c.address?'<div class="mut sm">📍 '+esc(c.address)+'</div>':'')+'</div>'+tag+'</div>';
  h+='<div class="g4 cg">'+
    '<div><b>'+st.count+'</b><span>عدد البيعات</span></div>'+
    '<div><b>'+fmt(st.total)+'</b><span>مجموع ما اشتراه</span></div>'+
    '<div><b style="color:var(--g)">'+fmt(st.paid)+'</b><span>مجموع ما دفعه</span></div>'+
    '<div><b style="color:#b02a1c">'+fmt(st.remaining)+'</b><span>الباقي عليه</span></div></div>';
  if(st.shortfall>0.5)h+='<div class="kv"><span>متأخر '+st.lateM+' شهر · المطلوب منه</span><b style="color:var(--red)">'+money(st.shortfall)+'</b></div>';
  if(st.next)h+='<div class="kv"><span>القسط القادم</span><b>'+fdate(st.next)+' · '+money(st.monthly)+'</b></div>';
  if(st.last)h+='<div class="kv"><span>آخر دفعة</span><b>'+fdate(st.last)+'</b></div>';
  if(st.items.length)h+='<div class="kv"><span>المواد</span><b style="text-align:left">'+st.items.map(esc).join('، ')+'</b></div>';
  return h+'</div>';
}

sub('customers','customers',softRender);
sub('sales','sales',softRender);
sub('payments','payments',softRender);
['expenses','income','staff','salaries','stock'].forEach(function(k){db.collection(k).onSnapshot(function(snap){S[k]=mapDocs(snap);softRender()},function(){})});
db.doc('settings/shop').onSnapshot(function(d){S.shop=d.exists?(d.data()||{}):{};S.ready.h=true;softRender()},function(){S.ready.h=true});
setTimeout(function(){S.timeout=true;render()},10000);

/* ---------- calculations ---------- */
function sumPays(saleId,upto){var t=0;S.payments.forEach(function(p){if(p.saleId===saleId&&(!upto||p.date<=upto))t+=p.amount+(+p.disc||0)});return t}
function discOf(saleId){var t=0;S.payments.forEach(function(p){if(p.saleId===saleId)t+=(+p.disc||0)});return t}
function realOf(p,s){var d=+p.disc||0;return s?(p.amount+d)*ratio(s)-d:0}
function lastPay(saleId){var m='';S.payments.forEach(function(p){if(p.saleId===saleId&&p.date>m)m=p.date});return m}
function info(s,upto){
  var monthly=(s.price-s.down)/s.months;
  var downIn=(!upto||s.startDate<=upto)?s.down:0;
  var paid=downIn+sumPays(s.id,upto);
  var ref=upto||todayISO();
  var due=0;for(var k=1;k<=s.months;k++){if(addMonths(s.startDate,k)<=ref)due++}
  var expected=Math.min(s.price,downIn+monthly*due);
  var shortfall=Math.max(0,expected-paid);
  var remaining=Math.max(0,s.price-s.down-sumPays(s.id));
  var behind=monthly>0?Math.ceil(shortfall/monthly-0.001):0;
  var next='';for(var j=1;j<=s.months;j++){var dd=addMonths(s.startDate,j);if(dd>ref){next=dd;break}}
  return{disc:discOf(s.id),monthly:monthly,paid:s.down+sumPays(s.id)-discOf(s.id),remaining:remaining,shortfall:shortfall,behind:behind,next:next};
}
function custStats(cid){
  var rem=0,sf=0,n=0,tot=0,paid=0,next='',mon=0,last='',items=[];
  S.sales.forEach(function(s){if(s.customerId===cid){var i=info(s);rem+=i.remaining;sf+=i.shortfall;n++;tot+=s.price;paid+=i.paid;items.push(s.item);if(i.remaining>0.5&&i.next&&(!next||i.next<next)){next=i.next;mon=i.monthly}var lp=lastPay(s.id);if(lp>last)last=lp}});
  var LL=lateOf(cid);sf=LL?LL.req:0;
  return{lateM:LL?LL.months:0,remaining:rem,shortfall:sf,count:n,total:tot,paid:paid,next:next,monthly:mon,last:last,items:items};
}
function ratio(s){return s.price>0?(s.price-s.cost)/s.price:0}
function periodStats(a,b){
  var r={count:0,total:0,profit:0,collected:0,realized:0,downs:0,pays:0};
  S.sales.forEach(function(s){if(s.startDate>=a&&s.startDate<=b){r.count++;r.total+=s.price;r.profit+=s.price-s.cost;r.collected+=s.down;r.downs+=s.down;r.realized+=s.down*ratio(s)}});
  S.payments.forEach(function(p){if(p.date>=a&&p.date<=b){var s=smap[p.saleId];r.collected+=p.amount;r.pays+=p.amount;r.realized+=realOf(p,s)}});
  return r;
}
var dayDiff=function(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5)};
function lateOf(cid,asOf){
  asOf=asOf||todayISO();
  var ref='',lp='',req=0,its=[];
  S.sales.forEach(function(s){
    if(s.customerId!==cid||s.startDate>asOf)return;
    var rem=s.price-s.down-sumPays(s.id,asOf);if(rem<=0.5)return;
    var l='';S.payments.forEach(function(p){if(p.saleId===s.id&&p.date<=asOf&&p.date>l)l=p.date});
    if(l>lp)lp=l;var r=l>s.startDate?l:s.startDate;if(r>ref)ref=r;its.push({s:s,rem:rem});
  });
  if(!its.length)return null;
  var days=dayDiff(ref,asOf);if(days<30)return null;
  var months=Math.floor(days/30);
  its.forEach(function(x){x.mon=(x.s.price-x.s.down)/x.s.months;x.req=Math.min(x.rem,months*x.mon);req+=x.req});
  return {days:days,months:months,req:req,lastPaid:lp,since:ref,items:its};
}
function lateList(asOf){
  var out=[];S.customers.forEach(function(c){var L=lateOf(c.id,asOf);if(L)out.push({c:c,L:L})});
  out.sort(function(a,b){return b.L.months-a.L.months||b.L.req-a.L.req});return out;
}
function debtors(upto){
  return lateList(upto).map(function(x){return {c:x.c,s:{id:'',item:x.L.items.map(function(i){return i.s.item}).join('، ')},i:{shortfall:x.L.req,behind:x.L.months},lp:x.L.lastPaid}});
}

/* ---------- ui helpers ---------- */
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function openModal(html){modal.innerHTML='<div class="sheet">'+html+'</div>';modal.classList.add('open');var sh=$('.sheet',modal);if(sh)sh.scrollTop=0}

  $('#yes').onclick=async function(){this.disabled=true;try{await yes()}catch(e){toast('تعذّرت العملية')}closeModal()};
}
function avatar(c,big){
  var cls='av'+(big?' big':'');
  if(c&&c.photo&&String(c.photo).indexOf('data:image/')===0)return '<div class="'+cls+'"><img alt="" src="'+esc(c.photo)+'"></div>';
  return '<div class="'+cls+'">'+esc(((c&&c.name)||'؟').trim().charAt(0))+'</div>';
}
function readPhoto(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=360,w=im.width,h=im.height,r=Math.min(1,m/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',0.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function roleBy(){return S.admin?'مدير':'موظف'}

/* ---------- views ---------- */
var NK=['view','cid','mode','day','wk','month','year'];
function snap(){var o={};NK.forEach(function(k){o[k]=S[k]});return o}
function goTo(ch){S.navT=Date.now();setTimeout(render,12500);var cur=snap(),nx={};NK.forEach(function(k){nx[k]=(k in ch)?ch[k]:cur[k]});if(JSON.stringify(cur)!==JSON.stringify(nx)){S.hist.push(cur);if(S.hist.length>60)S.hist.shift()}Object.assign(S,nx);render();window.scrollTo(0,0)}

    (S.err?'<div class="warn">تعذّر تحميل بعض البيانات ('+esc(S.err)+').</div>':'');

function schedHTML(s,i){
  var t=todayISO(),left=sumPays(s.id),rows='',nPaid=0;
  for(var k=1;k<=s.months;k++){
    var due=addMonths(s.startDate,k),cv=Math.max(0,Math.min(i.monthly,left));left-=cv;
    var st,col;
    if(cv>=i.monthly-0.5){st='✓ مدفوع';col='#17663f';nPaid++}
    else if(cv>0.5){st='جزئي: '+fmt(cv)+(due<=t?' · متأخر':'');col='#b9770e'}

  openModal((fresh?'<div style="background:linear-gradient(180deg,#e4f6ec,#cdeedb);color:#17663f;font-weight:700;border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 3px 0 #9fd3b6;text-align:center">✅ تم الحفظ — اطبع الوصل للزبون من الزر الأخضر بالأسفل</div>':'')+'<div class="receipt"><h3>'+esc(shop.name||'نظام البيع بالأقساط')+'</h3><div style="text-align:center;font-weight:700;margin-bottom:6px">'+R.title+'</div>'+(R.lines?grpKV(R):'<div class="kv"><span>رقم الوصل</span><b>'+esc(R.no)+'</b></div><div class="kv"><span>التاريخ</span><b>'+fdate(R.date)+'</b></div><div class="kv"><span>الزبون</span><b>'+esc(R.c.name||'')+'</b></div><div class="kv"><span>المادة</span><b>'+esc(R.item||'')+'</b></div><div class="kv"><span>السعر الكلي</span><b>'+money(R.price)+'</b></div><div class="kv"><span>القسط الشهري</span><b>'+money(R.monthly)+'</b></div><div class="kv" style="font-size:18px"><span>'+R.amtLbl+'</span><b style="color:var(--g)">'+money(R.amount)+'</b></div>'+(R.disc?'<div class="kv"><span>خصم التسديد المبكر</span><b>'+money(R.disc)+'</b></div>':'')+'<div class="kv"><span>مجموع ما دفعه</span><b>'+money(R.paid)+'</b></div><div class="kv" style="font-size:18px"><span>المتبقي عليه</span><b style="color:var(--red)">'+money(R.remaining)+'</b></div>')+'</div>'+
  '<div class="row wrap" style="margin-top:12px"><button class="btn grow" id="pr">🖨️ اطبع الوصلين</button>'+(DL?'<button class="btn sec grow" id="sv">💾 احفظ للطباعة</button>':'')+'</div>'+(R.kind==='sale'?'<button class="btn block" style="margin-top:8px;background:linear-gradient(180deg,#4a90e2,#2f6fc0);box-shadow:0 4px 0 #1f4f8f" id="ctr">📝 اطبع عقد البيع (للزبون والكفيل)</button>':'')+'<div class="row" style="margin-top:8px"><button class="btn gray grow" id="cp">نسخ نص الوصل</button><button class="btn gray grow" id="cl">إغلاق</button></div><textarea id="tx" rows="1" readonly style="display:none;margin-top:10px"></textarea><p class="mut sm" style="margin:8px 0 0">يُطبع على ورقة A4 واحدة: <b>نسخة الزبون</b> و<b>نسخة المحل</b> وبينهما خط القص. إذا ما ظهرت نافذة الطباعة استعمل زر «احفظ للطباعة» ثم افتح الملف.</p>');
  if($('#ctr'))$('#ctr').onclick=function(){var sc=smap[R.sid];if(sc)printBox('📝 عقد البيع بالأقساط',contractSheet(sc),'عقد-'+(sc.no||sc.id)+'.html')};
  $('#pr').onclick=function(){doPrint(recSheet(R))};
  if($('#sv'))$('#sv').onclick=function(){doSave(recSheet(R),'وصل-'+R.no+'.html',R.title+' '+R.no)};
  $('#cl').onclick=function(){closeModal();if(fresh)goTo({view:'customer',cid:R.cid})};
  $('#cp').onclick=async function(){
    try{await navigator.clipboard.writeText(text);toast('تم نسخ الوصل')}
    catch(e){var t=$('#tx');t.style.display='block';t.rows=9;t.value=text;t.focus();t.select();toast('انسخ النص من الأسفل')}
  };
}
function rptRange(){
  if(S.mode==='day')return {a:S.day,b:S.day,t:'التقرير اليومي',per:'يوم '+dayName(S.day)+' '+fdate(S.day),f:S.day};
  if(S.mode==='week'){var wa=S.wk||weekStart(todayISO());return {a:wa,b:addDays(wa,6),t:'التقرير الأسبوعي',per:'من السبت '+fdate(wa)+' إلى الجمعة '+fdate(addDays(wa,6)),f:wa}}
  if(S.mode==='month'){var p=S.month.split('-').map(Number);return {a:S.month+'-01',b:isoOf(new Date(p[0],p[1],0)),t:'التقرير الشهري',per:'شهر '+MONTHS[p[1]-1]+' '+p[0],f:S.month}}
  return {a:S.year+'-01-01',b:S.year+'-12-31',t:'التقرير السنوي',per:'سنة '+S.year,f:String(S.year)};
}
function rptSheet(){
  var g=rptRange(),t=todayISO(),st=periodStats(g.a,g.b),out=0,shop=S.shop||{};
  S.sales.forEach(function(s){out+=info(s).remaining});
  var h='<div class="rh" style="--k:#1f7a4d"><div><div class="shop">'+esc(shop.name||'نظام البيع بالأقساط')+'</div>'+(shop.phone?'<div class="meta">هاتف: '+esc(shop.phone)+'</div>':'')+'</div><div style="text-align:left"><h1>'+g.t+'</h1><div class="meta">'+g.per+'</div><div class="meta">تاريخ الطباعة: '+fdate(t)+' · '+timeNow()+'</div></div></div>';
  h+='<h2>الخلاصة</h2><table><tr><th>عدد البيعات</th><td>'+st.count+'</td><th>مجموع المبيعات</th><td>'+money(st.total)+'</td></tr><tr><th>المقدّمات المقبوضة</th><td>'+money(st.downs)+'</td><th>الأقساط المقبوضة</th><td>'+money(st.pays)+'</td></tr><tr class="big"><th>مجموع النقد المحصَّل</th><td>'+money(st.collected)+'</td><th>أرباح المبالغ المستلمة</th><td>'+money(st.realized)+'</td></tr><tr><th>ربح البيعات الجديدة (كامل مدة التقسيط)</th><td>'+money(st.profit)+'</td><th>المتبقي عند كل الزبائن الآن</th><td>'+money(out)+'</td></tr>'+(function(){var T=cashTotals(g.a,g.b),dy=S.mode==='day',nt=st.realized-T.ex-(dy?0:T.sl);return '<tr class="big"><th>الربح الصافي'+(dy?' (أرباح المستلم − المصاريف)':' (أرباح المستلم − المصاريف − الرواتب)')+'</th><td colspan="3">'+money(nt)+'</td></tr>'})()+'</table>';
  if(S.mode==='week'){
    h+='<h2>أيام الأسبوع</h2><table><tr><th>اليوم</th><th>التاريخ</th><th>البيعات</th><th>مجموع المبيعات</th><th>المحصَّل</th></tr>';
    for(var i=0;i<7;i++){var d=addDays(g.a,i),x=periodStats(d,d);h+='<tr><td>'+dayName(d)+'</td><td>'+fdate(d)+'</td><td>'+x.count+'</td><td>'+fmt(x.total)+'</td><td>'+fmt(x.collected)+'</td></tr>'}
    h+='<tr class="tot"><td colspan="2">المجموع</td><td>'+st.count+'</td><td>'+fmt(st.total)+'</td><td>'+fmt(st.collected)+'</td></tr></table>';
  }
  if(S.mode==='year'){
    h+='<h2>حسب الأشهر</h2><table><tr><th>الشهر</th><th>البيعات</th><th>مجموع المبيعات</th><th>المحصَّل</th><th>أرباح المستلم</th></tr>';
    for(var m=1;m<=12;m++){var r=periodStats(S.year+'-'+pad(m)+'-01',isoOf(new Date(S.year,m,0)));h+='<tr><td>'+MONTHS[m-1]+'</td><td>'+r.count+'</td><td>'+fmt(r.total)+'</td><td>'+fmt(r.collected)+'</td><td>'+fmt(r.realized)+'</td></tr>'}
    h+='<tr class="tot"><td>المجموع</td><td>'+st.count+'</td><td>'+fmt(st.total)+'</td><td>'+fmt(st.collected)+'</td><td>'+fmt(st.realized)+'</td></tr></table>';
  }else{
    var sl=S.sales.filter(function(s){return s.startDate>=g.a&&s.startDate<=g.b}).sort(function(x,y){return String(x.startDate).localeCompare(String(y.startDate))||(x.createdAt||0)-(y.createdAt||0)});
    h+='<h2>المبيعات ('+sl.length+')</h2>';
    if(!sl.length)h+='<div class="none">لا توجد مبيعات.</div>';
    else{var tp=0,td=0,tf=0;h+='<table><tr><th>#</th><th>التاريخ</th><th>الزبون</th><th>المادة</th><th>السعر</th><th>المقدّم</th><th>الأشهر</th><th>الربح</th></tr>'+sl.map(function(s,i){var c=cmap[s.customerId];tp+=s.price;td+=s.down;tf+=s.price-s.cost;return '<tr><td>'+(i+1)+'</td><td>'+fdate(s.startDate)+'</td><td>'+esc(c?c.name:'—')+'</td><td>'+esc(s.item)+'</td><td>'+fmt(s.price)+'</td><td>'+fmt(s.down)+'</td><td>'+s.months+'</td><td>'+fmt(s.price-s.cost)+'</td></tr>'}).join('')+'<tr class="tot"><td colspan="4">المجموع</td><td>'+fmt(tp)+'</td><td>'+fmt(td)+'</td><td></td><td>'+fmt(tf)+'</td></tr></table>'}
    var pl=S.payments.filter(function(p){return p.date>=g.a&&p.date<=g.b}).sort(function(x,y){return String(x.date).localeCompare(String(y.date))||(x.createdAt||0)-(y.createdAt||0)});
    h+='<h2>الأقساط المقبوضة ('+pl.length+')</h2>';
    if(!pl.length)h+='<div class="none">لا توجد دفعات.</div>';
    else{var ta=0;h+='<table><tr><th>#</th><th>التاريخ</th><th>رقم الوصل</th><th>الزبون</th><th>المادة</th><th>المبلغ</th><th>المتبقي بعدها</th><th>المستلم</th></tr>'+pl.map(function(p,i){var c=cmap[p.customerId],s=smap[p.saleId];ta+=p.amount;return '<tr><td>'+(i+1)+'</td><td>'+fdate(p.date)+'</td><td>'+esc(p.no||'')+'</td><td>'+esc(c?c.name:'—')+'</td><td>'+esc(s?s.item:'')+(p.disc?' (تسديد مبكر)':'')+'</td><td>'+fmt(p.amount)+'</td><td>'+fmt(receiptText(p).remaining)+'</td><td>'+esc(p.colName||'')+'</td></tr>'}).join('')+'<tr class="tot"><td colspan="5">المجموع</td><td>'+fmt(ta)+'</td><td colspan="2"></td></tr></table>'}
    if(g.a<=t){
      var up=g.b<t?g.b:t,ds=debtors(up);
      h+='<h2>المتأخرون عن الدفع حتى '+fdate(up)+' ('+ds.length+')</h2>';
      if(!ds.length)h+='<div class="none">لا يوجد متأخرون.</div>';
      else{var tl=0;h+='<table><tr><th>#</th><th>الزبون</th><th>الهاتف</th><th>المادة</th><th>أشهر بلا دفع</th><th>المبلغ المتأخر</th><th>آخر دفعة</th></tr>'+ds.map(function(d,i){tl+=d.i.shortfall;var lp=d.lp;return '<tr><td>'+(i+1)+'</td><td>'+esc(d.c?d.c.name:'—')+'</td><td>'+esc(d.c&&d.c.phone||'')+'</td><td>'+esc(d.s.item)+'</td><td>'+d.i.behind+'</td><td>'+fmt(d.i.shortfall)+'</td><td>'+(lp?fdate(lp):'لم يدفع')+'</td></tr>'}).join('')+'<tr class="tot"><td colspan="5">المجموع</td><td>'+fmt(tl)+'</td><td></td></tr></table>'}
    }
  }
  if(S.mode==='month'||S.mode==='year')h+=profitAllBox(true);
  if(S.mode!=='week')h+=cashRep(true);
  h+='<div class="sig" style="margin-top:12mm"><span>توقيع المحاسب</span><span>توقيع المدير</span></div>';
  return h;
}
/* ---------- events ---------- */
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='ext')return;
  if(a==='close'){closeModal();return}
  if(a==='stmt'){var cc=cmap[id];if(cc)printBox('📄 كشف حساب: '+cc.name,stmtSheet(cc),'كشف-حساب-'+cc.name+'.html');return}
  if(a==='contract'){var sc=smap[id];if(sc)printBox('📝 عقد البيع بالأقساط',contractSheet(sc),'عقد-'+(sc.no||sc.id)+'.html');return}
  if(a==='payoff'&&S.admin){if(smap[id])payoffForm(smap[id]);return}
  if(a==='adddoc'){if(cmap[S.cid])docForm(cmap[S.cid]);return}
  if(a==='viewdoc'){viewDoc(id);return}
  if(a==='addstock'){stockForm(null);return}
  if(a==='editstock'){stockForm((S.stock||[]).find(function(x){return x.id===id}));return}
  if(a==='stockin'){var sx=(S.stock||[]).find(function(x){return x.id===id});if(sx)stockIn(sx);return}
  if(a==='delstock'&&S.admin){ask('حذف هذه البضاعة من المخزن؟',async function(){await db.doc('stock/'+id).delete();dropLocal('stock',id);render()});return}
  if(a==='xlsx'&&S.admin){exportXLSX();return}
  if(a==='go'){var gv=el.getAttribute('data-v');if(gv==='home')goHome();else goTo({view:gv});return}
  if(a==='back'){closeModal();goBack();return}
  if(a==='home'){closeModal();goHome();return}
  if(a==='opencust'){goTo({view:'customer',cid:id});return}
  if(a==='dash'){var t0=todayISO();goTo({view:'reports',mode:el.getAttribute('data-m'),day:t0,wk:weekStart(t0),month:t0.slice(0,7),year:Number(t0.slice(0,4))});return}
  if(a==='ctab'){S.cashTab=el.getAttribute('data-t');render();return}
  if(a==='addexp'){moneyForm('expenses');return}
  if(a==='addinc'){moneyForm('income');return}
  if(a==='addstaff'){staffForm(null);return}
  if(a==='editstaff'){staffForm((S.staff||[]).find(function(x){return x.id===id}));return}
  if(a==='paysal'){salForm(id||'');return}
  if(a==='delx'&&S.admin){var kk=el.getAttribute('data-k');ask('حذف هذا السجل؟ سيرجع المبلغ إلى القاصة.',async function(){await db.doc(kk+'/'+id).delete();dropLocal(kk,id);render()});return}
  if(a==='delstaff'&&S.admin){ask('حذف هذا الموظف؟ (رواتبه المصروفة تبقى في السجلات)',async function(){await db.doc('staff/'+id).delete();dropLocal('staff',id);render()});return}
  if(a==='lprint'){doPrint(lateSheet());return}
  if(a==='lsave'){doSave(lateSheet(),'تقرير-المتأخرين-'+todayISO()+'.html','تقرير المتأخرين');return}
  if(a==='salerec'){var so=smap[id];if(so)showRec(recOf('sale',so),false);return}
  if(a==='rprint'){doPrint(rptSheet());return}
  if(a==='rsave'){var gg=rptRange();doSave(rptSheet(),gg.t.replace(/ /g,'-')+'-'+gg.f+'.html',gg.t+' '+gg.per);return}
  if(a==='wkm'){S.wk=addDays(S.wk||weekStart(todayISO()),Number(el.getAttribute('data-d')));render();return}
  if(a==='pickday'){goTo({day:el.getAttribute('data-d'),mode:'day'});return}
  if(a==='mode'){goTo({mode:el.getAttribute('data-m')});return}
  if(a==='yr'){S.year+=Number(el.getAttribute('data-d'));render();return}
  if(a==='newcust'){custForm(null);return}
  if(a==='editcust'){custForm(cmap[id]);return}
  if(a==='newsale'){saleForm(null,el.getAttribute('data-cid')||(S.view==='customer'?S.cid:''));return}
  if(a==='editsale'){saleForm(smap[id]);return}
  if(a==='months'){if(smap[id])monthsForm(smap[id]);return}
  if(a==='newpay'){payForm(el.getAttribute('data-sid')||'',el.getAttribute('data-cid')||(S.view==='customer'?S.cid:''));return}
  if(a==='receipt'){var p=S.payments.find(function(x){return x.id===id});if(p)showReceipt(p,false);return}
  if(a==='delpay'&&S.admin){ask('حذف هذه الدفعة؟ سيرجع المبلغ إلى المتبقي.',async function(){await db.doc('payments/'+id).delete();dropLocal('payments',id);render()});return}
  if(a==='delsale'&&S.admin){ask('حذف هذه البيعة مع كل دفعاتها؟',async function(){var ps=S.payments.filter(function(x){return x.saleId===id});for(var i=0;i<ps.length;i++){await db.doc('payments/'+ps[i].id).delete();dropLocal('payments',ps[i].id)}var sk=(smap[id]||{}).stockId;await db.doc('sales/'+id).delete();dropLocal('sales',id);if(sk)await stockMove(sk,1);render()});return}
  if(a==='delcust'&&S.admin){
    var has=S.sales.some(function(s){return s.customerId===id});
    if(has){openModal('<h3>لا يمكن الحذف</h3><p>لهذا الزبون مبيعات. احذف مبيعاته أولاً.</p><button class="btn gray block" data-act="close">حسناً</button>');return}
    ask('حذف هذا الزبون؟',async function(){await db.doc('customers/'+id).delete();dropLocal('customers',id);goHome()});return
  }
  if(a==='saveshop'&&S.admin){
    try{await db.doc('settings/shop').set({name:$('#sn').value.trim(),phone:$('#sp').value.trim(),footer:$('#sf').value.trim()});toast('تم الحفظ')}catch(err){toast('تعذّر الحفظ')}
    return;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q2'){S.q2=e.target.value;var l2=$('#list2');if(l2)l2.innerHTML=custRows(S.q2,true)}
  if(e.target.id==='q'){S.q=e.target.value;var l=$('#list');if(l)l.innerHTML=S.q.trim()?custRows():'';var dw=$('#dashW');if(dw)dw.style.display=S.q.trim()?'none':''}
});
document.addEventListener('change',function(e){
  if(e.target.id==='cm'&&e.target.value){S.cmonth=e.target.value;render()}
  if(e.target.id==='rd'&&e.target.value){S.day=e.target.value;render()}
  if(e.target.id==='rm'&&e.target.value){S.month=e.target.value;render()}
  if(e.target.id==='ry'){var v=parseInt(e.target.value,10);if(v>1990&&v<2200){S.year=v;render()}}
});
render();
})();
</script>
