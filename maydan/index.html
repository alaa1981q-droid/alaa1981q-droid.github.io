<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ميادين النصر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;800&display=swap">
<style>
/* لعبة استراتيجية: شاشة واحدة بعرض الهاتف، خريطة صحراوية بلون الرق، أزرار ثلاثية الأبعاد */
:root{
  --sand:#e9d7ae; --sand2:#d9c08a; --ink:#3b2a14; --ink2:#6b5332;
  --green:#1f7a4d; --green2:#145236; --red:#9b2c22; --red2:#6d1d16;
  --gold:#c9962b; --gold2:#8f6a17; --paper:#f7ecd2; --night:#1d1a14;
  --fd:"Amiri","Cairo",system-ui,sans-serif; --fb:"Cairo",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--fb);direction:rtl;overflow:hidden;-webkit-tap-highlight-color:transparent}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scr.on{display:flex}
#menu,#brief{background:radial-gradient(ellipse at 50% 0%,#f6e6bf 0%,var(--sand) 55%,var(--sand2) 100%);overflow-y:auto}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--fd);font-weight:700;font-size:40px;margin:6px 0 0;text-align:center;color:var(--green2);text-shadow:0 2px 0 #fff8,0 4px 0 #0001;text-wrap:balance}
.sub{text-align:center;font-weight:600;color:var(--ink2);margin:0;font-size:15px}
.bt{font-family:var(--fb);font-weight:800;font-size:16px;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;color:#fff;background:var(--c,var(--green));box-shadow:0 4px 0 var(--d,var(--green2)),0 6px 12px #0003,inset 0 2px 0 #ffffff40;transition:transform .08s}
.bt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--d,var(--green2)),0 2px 6px #0003,inset 0 2px 0 #ffffff40}
.bt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bt.gold{--c:var(--gold);--d:var(--gold2)}
.bt.red{--c:var(--red);--d:var(--red2)}
.bt.plain{--c:#fff6e2;--d:#cdb37c;color:var(--ink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--paper);border-radius:16px;padding:12px;box-shadow:0 4px 0 #c6a96c,0 8px 16px #0002,inset 0 2px 0 #fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;border:0;text-align:right;font-family:var(--fb);color:var(--ink)}
.card b{font-family:var(--fd);font-size:22px;color:var(--green2)}
.card small{font-weight:600;color:var(--ink2);font-size:13px}
.card .yr{font-size:12px;font-weight:800;color:var(--gold2)}
.card:last-child:nth-child(odd){grid-column:1/-1}
.card.lock{opacity:.6;cursor:default}
.card .st{font-size:15px;letter-spacing:2px}
.note{background:#fff6e2;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.9;box-shadow:0 3px 0 #d8bf86,inset 0 2px 0 #fff}
.brief h2{font-family:var(--fd);font-size:32px;margin:0;color:var(--green2);text-align:center}
.brief p{margin:0;line-height:2;font-size:15.5px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{border-radius:14px;padding:10px;text-align:center;color:#fff;box-shadow:0 4px 0 var(--d),inset 0 2px 0 #ffffff40;background:var(--c)}
.num b{display:block;font-size:24px;font-family:var(--fd)}
.num span{font-size:13px;font-weight:700}
.goal{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:14.5px;line-height:1.8}
/* game */
#game{background:var(--night)}
.hud{display:flex;gap:8px;align-items:center;padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:#2a241a;color:#f4e6c4}
.bars{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.bar{height:14px;border-radius:7px;background:#0005;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;right:auto;border-radius:7px;transition:width .3s}
.bar.m i{background:linear-gradient(#3fb27a,var(--green))}
.bar.q i{background:linear-gradient(#d4574b,var(--red))}
.bar em{position:absolute;inset:0;font-style:normal;font-size:11px;font-weight:800;line-height:14px;padding:0 8px;color:#fff;text-shadow:0 1px 1px #000a;white-space:nowrap}
.hb{width:40px;height:40px;padding:0;font-size:18px;border-radius:12px}
#stage{flex:1;position:relative;overflow:hidden;background:#cdb47f}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:#fff6e2f0;color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 #c6a96c,0 6px 12px #0003;text-align:center;line-height:1.7;pointer-events:none;box-sizing:border-box}
.dock{display:flex;flex-direction:column;gap:7px;align-items:stretch;padding:8px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));background:#2a241a;color:#f4e6c4;flex-wrap:wrap}
#sel{min-width:0;font-weight:800;font-size:14px;line-height:1.4;text-align:center;color:#f1c96a}
.grp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gb{font-family:var(--fb);font-weight:800;font-size:12px;border:0;border-radius:12px;padding:6px 2px;color:#fff;background:var(--green);box-shadow:0 3px 0 var(--green2),inset 0 2px 0 #ffffff40;cursor:pointer;line-height:1.3;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gb b{display:block;font-size:17px}
.gb.on{background:#f1c96a;color:#3b2a14;box-shadow:0 3px 0 var(--gold2),0 0 0 3px #fff}
.gb:disabled{opacity:.45}
.ord{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ob{padding:6px 0;font-size:18px;border-radius:12px;line-height:1.2}
.ob span{display:block;font-size:12px}
.ob:disabled{opacity:.4}
#sel small{display:block;font-weight:600;opacity:.8;font-size:12px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.modal .in{background:var(--paper);border-radius:20px;max-width:460px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 6px 0 #c6a96c,0 16px 40px #0006,inset 0 2px 0 #fff;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.modal h3{font-family:var(--fd);font-size:26px;margin:0;color:var(--green2);text-align:center}
.modal p{margin:0;line-height:2;font-size:15.5px}
.modal .nav{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0}
.modal .nav .bt{flex:1}
.stars{text-align:center;font-size:34px;letter-spacing:6px}
.fn{font-size:12.5px;color:var(--ink2);border-top:1px solid #c6a96c;padding-top:8px;line-height:1.8}
.l3{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.u3l,.t3l{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.u3l{display:flex;flex-direction:column;align-items:center;gap:2px}
.u3l b{font:800 10px var(--fb);color:#fff;padding:0 5px;border-radius:7px;line-height:1.5;background:rgba(15,61,39,.82);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.u3l.q b{background:rgba(90,21,16,.85)}
.u3l.sel b{background:#f1c96a;color:#3b2a14;box-shadow:0 0 0 2px #fff}
.u3l i{display:block;width:30px;height:4px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}
.u3l i s{display:block;height:100%;background:#4cc287}
.u3l.q i s{background:#e2665a}
.u3l.duel b{font-size:11px;background:rgba(201,150,43,.95);color:#2a1a08}
.u3l.duel.q b{background:rgba(90,21,16,.9);color:#fff}
.t3l{font:700 13px var(--fd);color:#4a3418;text-shadow:0 0 6px #f5e7c6,0 0 2px #f5e7c6;opacity:.9}
.camb{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));z-index:3}
@media (prefers-reduced-motion:reduce){.bt{transition:none}}
</style>

<!-- القائمة -->
<section class="scr on" id="menu">
  <div class="wrap">
    <h1>ميادين النصر</h1>
    <p class="sub">قُد جيش المسلمين في غزوات النبيّ ﷺ، وتعلّم من كل معركة درسًا</p>
    <div class="cards" id="cards"></div>
    <div class="note">كيف تلعب؟ المس مجموعة من جيشك لتختارها، ثم المس المكان الذي تريد أن تذهب إليه، أو المس جيش العدو لتهاجمه. قبل المعركة رتّب جيشك في أحسن المواقع، ثم اضغط «ابدأ المعركة».</div>
  </div>
</section>

<!-- التمهيد -->
<section class="scr" id="brief">
  <div class="wrap brief" id="briefIn"></div>
</section>

<!-- اللعب -->
<section class="scr" id="game">
  <div class="hud">
    <button class="bt plain hb" id="bBack" aria-label="رجوع">→</button>
    <div class="bars">
      <div class="bar m"><i id="mBar"></i><em id="mTxt"></em></div>
      <div class="bar q"><i id="qBar"></i><em id="qTxt"></em></div>
    </div>
    <button class="bt plain hb" id="bPause" aria-label="إيقاف مؤقت">⏸</button>
    <button class="bt plain hb" id="bFast" aria-label="تسريع">⏩</button>
    <button class="bt plain hb" id="bSnd" aria-label="الصوت">🔊</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div class="tip" id="tip"></div></div>
  <div class="dock">
    <div id="sel">١- اختر مجموعة من جيشك</div>
    <div class="grp" id="grp"></div>
    <div class="ord" id="ord">
      <button class="bt ob" data-o="down">⬆️<span>تقدّم</span></button>
      <button class="bt ob" data-o="up">⬇️<span>تراجع</span></button>
      <button class="bt ob" data-o="right">➡️<span>يمين</span></button>
      <button class="bt ob" data-o="left">⬅️<span>يسار</span></button>
      <button class="bt ob red" data-o="atk">⚔️<span>هاجم</span></button>
      <button class="bt ob" data-o="stop">✋<span>اثبت</span></button>
    </div>
    <button class="bt gold" id="bGo">⚔️ ابدأ المعركة</button>
  </div>
</section>

<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const AR=n=>Math.round(n).toLocaleString('ar-EG');
let save={};try{save=JSON.parse(localStorage.getItem('maydan_v1')||'{}')}catch(e){}
const store=()=>{try{localStorage.setItem('maydan_v1',JSON.stringify(save))}catch(e){}};

const W=900,H=1200;
const KIND={
  inf:{sp:34,pow:1,r:34,ico:'🛡️',nm:'مشاة'},
  arc:{sp:32,pow:.55,r:32,rng:190,ico:'🏹',nm:'رماة'},
  cav:{sp:78,pow:1.5,r:34,ico:'🐎',nm:'فرسان'}
};

/* ===================== المعارك ===================== */
const BATTLES=[
 {id:'badr',name:'بدر',year:'السنة الثانية للهجرة',m:313,q:'نحو ١٠٠٠',
  story:['خرج المسلمون من المدينة المنورة وعددهم ثلاثمئة وبضعة عشر رجلًا، ومعهم فرسان قليلان وسبعون بعيرًا، وجاءت قريش بنحو ألف مقاتل ومعهم الخيل والسلاح.',
         'نزل المسلمون بالعدوة الدنيا القريبة من المدينة، ونزلت قريش بالعدوة القصوى البعيدة. وأشار الحُباب بن المنذر أن ينزل المسلمون عند أقرب ماء من القوم، فيكون الماء لهم.'],
  goals:['💧 ضع مجموعة من جيشك عند آبار بدر قبل أن تبدأ المعركة.','🧱 اجعل مجموعاتك متقاربة، فالصفوف المتراصّة أقوى.','⚔️ اصبر حتى يتراجع جيش قريش.'],
  deployMaxY:640,
  units:[
   ['m','inf','القلب',450,250,100],['m','inf','الميمنة',300,280,80],['m','inf','الميسرة',600,280,80],['m','arc','الرماة',450,170,50],
   ['q','inf','القلب',450,980,140],['q','inf','الميمنة',600,960,130],['q','inf','الميسرة',300,960,130],
   ['q','inf','المقدّمة',450,880,120],['q','arc','الرماة',450,1080,80],['q','cav','الخيّالة',180,1020,100],['q','inf','الساقة',700,1060,120]
  ],
  wells:{x:450,y:520,r:85}
 },
 {id:'uhud',name:'أُحُد',year:'السنة الثالثة للهجرة',m:700,q:'نحو ٣٠٠٠',
  story:['جاءت قريش بنحو ثلاثة آلاف مقاتل، فخرج المسلمون نحو سبعمئة، وجعلوا جبل أُحُد خلف ظهورهم.',
         'ووضع النبيّ ﷺ خمسين من الرماة على جبل صغير اسمه جبل الرماة، وأمرهم ألّا يتركوا مكانهم مهما حدث، حتى لا تلتفّ خيل قريش من خلف المسلمين.'],
  goals:['🏹 ضع الرماة فوق جبل الرماة.','🛡️ احمِ جيشك من الالتفاف من الخلف.','👂 أطع الأمر حتى آخر المعركة.'],
  deployMaxY:620,
  units:[
   ['m','inf','القلب',470,380,230],['m','inf','الميمنة',640,400,210],['m','inf','الميسرة',330,410,210],['m','arc','الرماة',470,280,50],
   ['q','inf','القلب',470,960,420],['q','inf','الميمنة',300,940,380],['q','inf','الميسرة',640,940,380],
   ['q','inf','المقدّمة',470,860,360],['q','arc','الرماة',480,1080,140],['q','cav','خيّالة الميمنة',150,1000,200],['q','cav','خيّالة الميسرة',760,1020,160]
  ],
  hill:{x:215,y:560,r:70}
 },
 {id:'khandaq',name:'الخندق',year:'السنة الخامسة للهجرة',lock:1},
 {id:'khaybar',name:'خيبر',year:'السنة السابعة للهجرة',lock:1},
 {id:'hunayn',name:'حُنَين',year:'السنة الثامنة للهجرة',lock:1}
];

/* ===================== القائمة ===================== */
function menu(){
  show('menu');
  $('cards').innerHTML=BATTLES.map(b=>{
    const s=save[b.id]||0;
    return `<button class="card ${b.lock?'lock':''}" data-id="${b.id}">
      <span class="yr">${b.year}</span><b>${b.lock?'🔒 ':''}غزوة ${b.name}</b>
      <small>${b.lock?'قريبًا إن شاء الله':(AR(b.m)+' مسلم أمام '+b.q)}</small>
      ${b.lock?'':`<span class="st">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</span>`}</button>`}).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const b=BATTLES.find(x=>x.id===c.dataset.id);if(!b.lock)brief(b)});
}
function brief(b){
  show('brief');
  $('briefIn').innerHTML=`<p class="sub" style="color:var(--gold2)">${b.year}</p><h2>غزوة ${b.name}</h2>
   <div class="nums"><div class="num" style="--c:var(--green);--d:var(--green2)"><b>${AR(b.m)}</b><span>جيش المسلمين تقريبًا</span></div>
   <div class="num" style="--c:var(--red);--d:var(--red2)"><b>${b.q}</b><span>جيش قريش</span></div></div>
   <div class="note">${b.story.map(t=>`<p>${t}</p>`).join('')}</div>
   <div class="note">${b.goals.map(g=>`<div class="goal">${g}</div>`).join('')}</div>
   <button class="bt gold" id="bStart">🗺️ ادخل الميدان</button>
   <button class="bt plain" id="bMenu">→ الغزوات</button>`;
  $('bStart').onclick=()=>start(b);$('bMenu').onclick=menu;
}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ===================== حالة اللعب ===================== */
let G=null;
function start(b){
  let id=0;
  G={b,t:0,phase:'deploy',speed:1,paused:false,sel:null,ev:{},over:false,
     units:b.units.map(u=>{const k=KIND[u[1]];return{id:id++,side:u[0],kind:u[1],name:u[2],x:u[3],y:u[4],tx:u[3],ty:u[4],n:u[5],max:u[5],face:u[0]==='m'?1:-1,st:'ok',hold:u[0]==='q',ai:0,hit:0,...k}})};
  G.home={x:450,y:b.id==='uhud'?230:150};
  show('game');resize();$('bGo').textContent='⚔️ ابدأ المعركة';
  if(R3.ok){try{R3.build()}catch(e){console.error(e)}}
  $('bGo').hidden=false;$('bPause').textContent='⏸';
  tip(b.id==='badr'?'رتّب جيشك: حرّك مجموعة إلى دائرة الآبار 💧':'رتّب جيشك: ضع الرماة فوق جبل الرماة 🏹');
  updSel();
}
const mUnits=()=>G.units.filter(u=>u.side==='m');
const qUnits=()=>G.units.filter(u=>u.side==='q'&&u.st!=='gone');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const inC=(u,c)=>c&&Math.hypot(u.x-c.x,u.y-c.y)<c.r;

/* ===================== المحاكاة ===================== */
function step(dt){
  const b=G.b;G.t+=dt;
  const us=G.units;G.dt=dt;
  // ذكاء العدو
  if(G.phase==='battle'){
    for(const u of us){ if(u.side!=='q'||u.st!=='ok')continue;
      u.ai-=dt; if(u.ai>0)continue; u.ai=.8;
      if(u.script){u.script(u);continue}
      if(u.hold&&G.t<u.wait)continue;
      let best=null,bd=1e9;
      for(const m of us){if(m.side!=='m'||m.st!=='ok')continue;const d=dist(u,m)+(m.y<300?120:0);if(d<bd){bd=d;best=m}}
      if(best){ if(u.kind==='arc'){const d=dist(u,best);if(d>u.rng*.9){const f=(d-u.rng*.85)/d;u.tx=u.x+(best.x-u.x)*f;u.ty=u.y+(best.y-u.y)*f}else{u.tx=u.x;u.ty=u.y}}
                else{u.tx=best.x;u.ty=best.y} }
    }
  }
  // الاشتباك
  for(const u of us)u.eng=null;
  if(G.phase==='battle'){
    for(const a of us){ if(a.st==='gone'||a.side!=='m')continue;
      for(const e of us){ if(e.side!=='q'||e.st==='gone')continue;
        if(a.st!=='ok'||e.st!=='ok')continue;
        if(dist(a,e)<a.r+e.r+6){ if(a.st==='ok')a.eng=e; if(e.st==='ok')e.eng=a; }
      }}
    for(const u of us){ if(u.st!=='ok'||!u.eng)continue;
      const e=u.eng; const dmg=0.2*u.pow*mult(u,e)*Math.sqrt(u.n)*dt*(u.kind==='arc'?.6:1);
      e.n-=dmg; e.hit=.25;
    }
    // الرمي
    for(const u of us){ if(u.kind!=='arc'||u.st!=='ok'||u.eng)continue;
      if(Math.hypot(u.tx-u.x,u.ty-u.y)>6)continue;
      let rng=u.rng*(u.side==='m'&&inC(u,b.hill)?1.25:1);
      let best=null,bd=rng;
      for(const e of us){if(e.side===u.side||e.st!=='ok')continue;const d=dist(u,e);if(d<bd){bd=d;best=e}}
      if(best){const dmg=0.16*u.pow*mult(u,best)*Math.sqrt(u.n)*dt*(best.kind==='cav'?1.6:1);best.n-=dmg;best.hit=.25;u.shot=(u.shot||0)+dt;u.aim=best}
      else u.aim=null;
    }
    // الحالات

        if(u&&u.st==='ok'&&!u.locked){G.sel=u;updSel()}}
      else{tap=null;const [a,b]=[...ptr.values()];g2={d:Math.hypot(a.x-b.x,a.y-b.y),a:Math.atan2(b.y-a.y,b.x-a.x),my:(a.y+b.y)/2}}});
    el.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const prev=ptr.get(e.pointerId);const dx=e.clientX-prev.x,dy=e.clientY-prev.y;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(ptr.size===2&&g2){const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),an=Math.atan2(b.y-a.y,b.x-a.x),my=(a.y+b.y)/2;
        sph.r*=g2.d/Math.max(1,d);let da=an-g2.a;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;sph.th-=da;sph.phi+=(my-g2.my)*.004;g2={d,a:an,my};return}
      if(!tap)return;
      if(tap.btn===2){sph.th-=dx*.006;sph.phi-=dy*.004;tap.pan=true;return}
      if(!tap.pan&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>10&&!(tap.u&&G.sel===tap.u))tap.pan=true;
      if(tap.pan){const k=sph.r*.0019;const c=Math.cos(sph.th),s=Math.sin(sph.th);tgt.x-=(dx*c+dy*s*1.25)*k;tgt.z-=(-dx*s+dy*c*1.25)*k}});
    const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(ptr.size<2)g2=null;
      if(!tap||!G||G.over){tap=null;return}const T=tap;tap=null;if(T.pan||T.btn===2)return;
      const moved=Math.hypot(e.clientX-T.x,e.clientY-T.y)>18;const s=G.sel;if(!s)return;
      if(T.u&&!moved)return;
      let p=null;const en=G.phase==='battle'&&unitAt(e.clientX,e.clientY,'q');if(en)p={x:en.x,y:en.y};else p=ground(e.clientX,e.clientY);if(!p)return;
      if(s==='all'){const L=selList(),c=L.reduce((a,u)=>({x:a.x+u.x/L.length,y:a.y+u.y/L.length}),{x:0,y:0});L.forEach(u=>order(u,{x:p.x+u.x-c.x,y:p.y+u.y-c.y},1));tip(en?'الجيش كله يهاجم ⚔️':'الجيش كله يتحرّك')}
      else order(s,p);
    };
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);tap=null;g2=null});
    el.addEventListener('wheel',e=>{e.preventDefault();sph.r*=Math.exp(e.deltaY*.0012)},{passive:false});
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
  /* المبارزة في بدر */
  function duel(done){
    G.phase='duel';G.paused=false;$('bGo').hidden=false;$('bGo').textContent='⏭ تخطَّ المبارزة';
    const mF=Math.min(...mUnits().map(u=>u.y))+0,ms=mUnits().filter(u=>u.st==='ok');const my=Math.max(...ms.map(u=>u.y))+40,qy=Math.min(...qUnits().map(u=>u.y))-40;
    const midY=(my+qy)/2,midX=450;
    const N=[['عليّ',-1],['حمزة',0],['عُبيدة',1]],QN=['الوليد','عتبة','شيبة'];
    const p=[];
    N.forEach((n,i)=>{const g=person('m');world.add(g);const l=document.createElement('div');l.className='u3l m duel';l.innerHTML=`<b>${n[0]}</b>`;lab.appendChild(l);p.push({g,l,side:'m',sx:midX+n[1]*40,sy:my,ex:midX+n[1]*40,ey:midY-14})});
    QN.forEach((n,i)=>{const g=person('q');world.add(g);const l=document.createElement('div');l.className='u3l q duel';l.innerHTML=`<b>${n}</b>`;lab.appendChild(l);p.push({g,l,side:'q',sx:midX+(i-1)*40,sy:qy,ex:midX+(i-1)*40,ey:midY+14})});
    duelS={p,t:0,done,midY};
    for(const d of p){const X=wx(d.sx),Z=wz(d.sy);d.g.position.set(X,hW(X,Z),Z);d.g.rotation.y=d.side==='m'?Math.PI:0}
    flyTo(0,wz(midY),34,.95);
    tip('المبارزة: خرج من المسلمين عليّ وحمزة وعُبيدة ⚔️');
  }
  function duelTick(dt,t){
    const D=duelS;D.t+=dt;const T=D.t;
    for(const d of D.p){const k=Math.min(1,T/3.2);const x=d.sx+(d.ex-d.sx)*k,y=d.sy+(d.ey-d.sy)*k;let X=wx(x),Z=wz(y);
      let arm=.15,bob=T<3.2?Math.abs(Math.sin(t*9))*.08:0;
      if(T>3.2&&T<7){const s=Math.sin(t*7+(d.side==='m'?0:1.5));arm=1.1+s*.5;const f=d.side==='m'?-1:1;Z+=f*Math.max(0,s)*.3}
      if(d.side==='q'&&T>7){d.dead=true;d.g.rotation.x=Math.min(1,(T-7)/.5)*(Math.PI/2-.1)*1;d.g.position.y=hW(X,Z)-Math.max(0,T-9)*.4}
      else d.g.position.set(X,hW(X,Z)+bob,Z);
      if(!(d.side==='q'&&T>7))d.g.position.x=X,d.g.position.z=Z;
      d.g.userData.arm.rotation.x=arm;
      if(d.side==='m'&&T>8){d.g.position.y+=Math.abs(Math.sin(t*8))*.25}
    }
    if(T>3.2&&!D.c1){D.c1=1;tip('التقى الفرسان ⚔️');}
    if(T>7&&!D.c2){D.c2=1;tip('غلب عليّ وحمزة وعُبيدة من خرج لهم من قريش 🌟')}
    if(T>10.5)endDuel();
  }
  function endDuel(){if(!duelS)return;const D=duelS;for(const d of D.p){world.remove(d.g);d.l.remove()}duelS=null;$('bGo').textContent='⚔️ ابدأ المعركة';home(true);D.done()}
  /* الغنائم في أحد */
  function goldPile(){
    gold=new T3.Group();const gm=()=>new T3.MeshLambertMaterial({color:0xd4a72c,emissive:0x8a6a10,emissiveIntensity:.4});
    for(let i=0;i<14;i++){const x=400+Math.random()*140,y=820+Math.random()*90;const m=new T3.Mesh(i%3?new T3.CylinderGeometry(.5,.7,.6,7):new T3.BoxGeometry(1,.7,.7),i%4===0?new T3.MeshLambertMaterial({color:0x9a7a52}):gm());m.position.set(wx(x),hS(x,y)+.3,wz(y));m.rotation.y=Math.random()*3;m.castShadow=true;gold.add(m)}
    world.add(gold);
  }
  /* الحلقة الرئيسية */
  let lastT=0;
  function frame(dt){
    if(!world)return;const t=performance.now()/1000;
    for(const o of units3)syncUnit(o,G.paused?0:dt,t);
    for(const u of G.units)if(!u._3)addUnit(u);
    for(let i=fallen.length-1;i>=0;i--){const f=fallen[i];if(!G.paused)f.t+=dt;if(f.t>4)fallen.splice(i,1)}
    if(duelS&&!G.paused)duelTick(dt,t);
    drawFigs(t);effects(dt,t);camUpd(dt);
    R.render(S,cam);labels();
  }
  function resize(){if(!S)return;const r=$('stage').getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/Math.max(1,r.height);cam.updateProjectionMatrix()}
  function hide(){if(S){R.domElement.style.display='none';lab.style.display='none';camBtn.style.display='none'}}
  return{ok:true,build,frame,resize,duel,skipDuel:endDuel,gold:goldPile,hide,_cam:()=>({tgt,sph}),_ground:ground,_unitAt:unitAt,_proj:v=>proj(v)};
})();

/* ===================== اللمس ===================== */
let down=null;
const world=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/sc,y:H-(e.clientY-r.top-oy)/sc}};
const isSel=u=>G.sel===u||(G.sel==='all'&&u.side==='m');
const selList=()=>!G.sel?[]:G.sel==='all'?mUnits().filter(u=>u.st==='ok'&&!u.locked):[G.sel];
const hitU=(p,side)=>{let best=null,bd=1e9;for(const u of G.units){if(u.st==='gone'||(side&&u.side!==side))continue;const d=Math.hypot(u.x-p.x,u.y-p.y);if(d<u.r+45&&d<bd){bd=d;best=u}}return best};
cv.addEventListener('pointerdown',e=>{if(!G||G.over)return;const p=world(e);const u=hitU(p,'m');down={p,u};
  if(u&&u.st==='ok'&&!u.locked){G.sel=u;updSel()}});
cv.addEventListener('pointerup',e=>{if(!G||!down||G.over)return;const p=world(e);const moved=Math.hypot(p.x-down.p.x,p.y-down.p.y)>18;
  const s=G.sel;
  if(s&&(moved||!down.u)){ if(s==='all'){const L=selList(),c=L.reduce((a,u)=>({x:a.x+u.x/L.length,y:a.y+u.y/L.length}),{x:0,y:0});L.forEach(u=>order(u,{x:p.x+u.x-c.x,y:p.y+u.y-c.y},1));tip('الجيش كله يتحرّك')} else order(s,p)}
  down=null;});
function order(u,p,q){
  if(u.st!=='ok'||u.locked)return;
  if(G.phase==='deploy')p.y=Math.min(p.y,G.b.deployMaxY-20);
  const e=G.phase==='battle'&&hitU(p,'q');
  if(e){u.tx=e.x;u.ty=e.y;if(!q)tip(`«${u.name}» يهاجم «${e.name}» ⚔️`)}else{u.tx=Math.max(20,Math.min(W-20,p.x));u.ty=Math.max(20,Math.min(H-20,p.y))}
  updSel();
}
function updSel(){const u=G.sel;
  $('sel').textContent=!u?'١- اختر مجموعة من الأزرار، أو المسها على الخريطة':u==='all'?'٢- الجيش كله مختار: اضغط أمرًا، أو المس مكانًا على الخريطة':`٢- «${u.name}» مختار: اضغط أمرًا، أو المس مكانًا على الخريطة`;
  grpBtns();}
function grpBtns(){
  const L=mUnits();
  const h=L.map(u=>`<button class="gb ${G.sel===u?'on':''}" data-u="${u.id}" ${u.st!=='ok'||u.locked?'disabled':''}><b>${u.st==='tired'?'💤':KIND[u.kind].ico}</b>${u.name}</button>`).join('')+`<button class="gb ${G.sel==='all'?'on':''}" data-u="all"><b>👥</b>الكل</button>`;
  if($('grp')._h!==h){$('grp').innerHTML=h;$('grp')._h=h}
  document.querySelectorAll('.ob').forEach(b=>b.disabled=!G.sel||(b.dataset.o==='atk'&&G.phase!=='battle'));
}
$('grp').onclick=e=>{const b=e.target.closest('.gb');if(!b||b.disabled||!G)return;const id=b.dataset.u;G.sel=id==='all'?'all':G.units[+id];updSel()};
$('ord').onclick=e=>{const b=e.target.closest('.ob');if(!b||b.disabled||!G||G.over)return;const o=b.dataset.o;const L=selList();if(!L.length)return;
  const D={up:[0,-140],down:[0,140],right:[140,0],left:[-140,0]};
  for(const u of L){
    if(D[o]){order(u,{x:u.tx+D[o][0],y:u.ty+D[o][1]},1)}
    else if(o==='stop'){u.tx=u.x;u.ty=u.y}
    else if(o==='atk'){let best=null,bd=1e9;for(const e of G.units){if(e.side!=='q'||e.st!=='ok')continue;const d=dist(u,e);if(d<bd){bd=d;best=e}}if(best){u.tx=best.x;u.ty=best.y}}
  }
  tip({up:'⬇️ تراجعوا للخلف',down:'⬆️ تقدّموا نحو العدو',right:'➡️ اتجهوا يمينًا',left:'⬅️ اتجهوا يسارًا',atk:'⚔️ هجوم على أقرب عدو',stop:'✋ اثبتوا في مكانكم'}[o]);
  updSel()};

/* ===================== الأزرار والتشغيل ===================== */
let tipT=0;function tip(t){$('tip').textContent=t;$('tip').hidden=false;tipT=5}
$('bGo').onclick=()=>{if(G.phase==='deploy')setupBattle();else if(G.phase==='duel')R3.skipDuel()};
$('bPause').onclick=()=>{if(G.over)return;G.paused=!G.paused;G.paused?SND.stop():SND.start();$('bPause').textContent=G.paused?'▶️':'⏸'};
$('bFast').onclick=()=>{G.speed=G.speed===1?2:1;$('bFast').style.setProperty('--c',G.speed===2?'#f1c96a':'')};
$('bBack').onclick=()=>{SND.stop();G=null;menu()};
$('bSnd').textContent=SND.on?'🔊':'🔇';
$('bSnd').onclick=()=>{$('bSnd').textContent=SND.toggle()?'🔊':'🔇'};
for(const ev of ['pointerup','touchend','click','keydown'])document.addEventListener(ev,()=>{if(SND.on)SND.init()},{passive:true});
function modal(title,ps,btns,extra=''){
  $('modalIn').innerHTML=`<h3>${title}</h3>${extra}${ps.map(p=>`<p>${p}</p>`).join('')}<div class="fn">الأحداث مأخوذة من كتب السيرة، والأعداد تقريبية.</div><div class="nav">${btns.map((b,i)=>`<button class="bt ${b[1]}" data-i="${i}">${b[0]}</button>`).join('')}</div>`;
  $('modal').classList.add('on');if(G)G.paused=true;
  $('modalIn').querySelectorAll('.nav .bt').forEach(x=>x.onclick=()=>{$('modal').classList.remove('on');if(G&&!G.over)G.paused=false;btns[+x.dataset.i][2]()});
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G){ if(!G.paused&&G.phase!=='done'){for(let i=0;i<G.speed;i++)step(dt)}
    SND.tick(dt,G);
    if(R3.ok)R3.frame(dt);else draw();
    const mn=mUnits().reduce((s,u)=>s+u.n,0),mm=mUnits().reduce((s,u)=>s+u.max,0);
    const qn=qUnits().filter(u=>u.st==='ok').reduce((s,u)=>s+u.n,0),qm=G.units.filter(u=>u.side==='q').reduce((s,u)=>s+u.max,0);
    $('mBar').style.width=(100*mn/mm)+'%';$('qBar').style.width=(100*qn/qm)+'%';$('mTxt').textContent='المسلمون '+AR(mn);$('qTxt').textContent='قريش '+AR(qn);
    if(tipT>0){tipT-=dt;if(tipT<=0)$('tip').hidden=true}
    if(Math.random()<.1)updSel();
  }
  requestAnimationFrame(loop);
}
window.__G=()=>G;window.__step=step;window.__start=id=>start(BATTLES.find(b=>b.id===id));window.__go=()=>setupBattle();
menu();requestAnimationFrame(loop);
})();
</script>
